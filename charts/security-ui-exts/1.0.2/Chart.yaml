annotations:
  catalog.cattle.io/certified: rancher # Any application we are adding as a helm chart
  catalog.cattle.io/namespace: cattle-ui-plugin-system # Must prefix with cattle- and suffix with -system=
  catalog.cattle.io/os: linux
  catalog.cattle.io/permits-os: linux, windows
  catalog.cattle.io/scope: management
  catalog.cattle.io/ui-component: plugins
  catalog.cattle.io/display-name: SUSE Security
  catalog.cattle.io/kube-version: '>= v1.16.0-0'
  catalog.cattle.io/rancher-version: '>= 2.11.0-0'
  catalog.cattle.io/ui-extensions-version: '>= 3.0.0 < 4.0.0'
  catalog.cattle.io/prime-only: "true"
  catalog.cattle.io/ui-extensions-bundle-members: vulnerability-scanner,runtime-enforcer
apiVersion: v2
appVersion: "1.0.2"
description: Vulnerability scanning and runtime enforcement for Rancher Manager
name: security-ui-exts
type: application
keywords:
  - security
  - vulnerability
  - runtime
  - suse
version: 1.0.2
icon: https://raw.githubusercontent.com/rancher/security-ui-exts/main/pkg/vulnerability-scanner/assets/img/icon-vulnerability-scanner.svg
home: https://github.com/rancher/security-ui-exts
dependencies:
  - name: vulnerability-scanner
    version: 0.9.3
    condition: vulnerability-scanner.enabled
  - name: runtime-enforcer
    version: 0.1.2
    condition: runtime-enforcer.enabled
